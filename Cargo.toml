[workspace]
resolver = "2"
members = [
    "crates/synapse-common",
    "crates/synapse-ebpf-common",
    "crates/synapse-sys",
    "crates/synapse-sensord",
    "crates/synapsectl",
    "xtask",
]
# Kernel-side eBPF programs: nightly, bpfel-unknown-none, own workspace.
# Build them with `cargo xtask build-ebpf`.
exclude = ["crates/synapse-ebpf"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.dependencies]
aya = "0.13"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rusqlite = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
tempfile = "3"
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
