# Install as /usr/lib/tmpfiles.d/ai-antivirus.conf
# Config is not secret but must not be world-writable (ai-antivirus enforces this).
#
# Root-owned folders never sit inside a folder owned by an unprivileged user (systemd-tmpfiles refuses that transition,
# and rightly: the owner of the parent could rename or swap the child). So rules and the corpus live in /etc/ai-antivirus, and
# quarantine and restore evidence in /var/lib/ai-antivirus-private.
d /etc/ai-antivirus     0755 root    root    -
d /var/lib/ai-antivirus 0750 ai-antivirus ai-antivirus -
# Rules are root-owned: the engine (user ai-antivirus) reads them and cannot change them. Shipped rules go in
# behavior/00-shipped.toml and yara/; your own in behavior/local/ (LOCAL- ids).
d /etc/ai-antivirus/rules          0755 root root -
d /etc/ai-antivirus/rules/behavior 0755 root root -
d /etc/ai-antivirus/rules/yara     0755 root root -
# The sensor (root) writes the event log. The setgid bit makes new log files
# belong to group ai-antivirus, so the engine and members of that group can read
# them (files are created mode 0640).
d /var/log/ai-antivirus 2750 root    ai-antivirus -
d /run/ai-antivirus     0750 ai-antivirus ai-antivirus -
# M4. Quarantined files: root only, never cleaned automatically.
d /var/lib/ai-antivirus-private            0700 root root -
d /var/lib/ai-antivirus-private/quarantine 0700 root root -
# Notification spool written by the responder (root); setgid so the files belong to group ai-antivirus-notify.
d /run/ai-antivirus-notify 2750 root ai-antivirus-notify -

# The analyzer's folder (M5). The engine (user ai-antivirus) writes bundles to spool/ and reads and removes answers in out/;
# ai-antivirus-analyzer (group ai-antivirus-analyzer) reads spool/ and writes out/. Neither can reach the other's state.
d /var/lib/ai-antivirus-analyzer       0750 ai-antivirus    ai-antivirus-analyzer -
d /var/lib/ai-antivirus-analyzer/spool 2750 ai-antivirus    ai-antivirus-analyzer -
d /var/lib/ai-antivirus-analyzer/out   2770 ai-antivirus-analyzer ai-antivirus-analyzer -
d /etc/ai-antivirus/corpus       0755 root       root       -

# Evidence copies of files replaced by a restore (root only, mode 000 files; never deleted automatically).
d /var/lib/ai-antivirus-private/restore-evidence 0700 root root -
