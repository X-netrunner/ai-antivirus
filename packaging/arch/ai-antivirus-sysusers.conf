# Install as /usr/lib/sysusers.d/ai-antivirus.conf
u ai-antivirus    - "AI Antivirus engine"        /var/lib/ai-antivirus /usr/bin/nologin
u ai-antivirus-analyzer - "AI Antivirus AI analyzer"   -                /usr/bin/nologin
# Members of this group see AI Antivirus's desktop notifications (ai-antivirus-notify reads /run/ai-antivirus-notify).
g ai-antivirus-notify -
# the engine writes into the analyzer's folder through this group (SupplementaryGroups= in ai-antivirus-engined.service)
m ai-antivirus ai-antivirus-analyzer
