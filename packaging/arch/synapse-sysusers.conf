# Install as /usr/lib/sysusers.d/synapse.conf
u synapse    - "Synapse EDR engine"        /var/lib/synapse /usr/bin/nologin
u synapse-ai - "Synapse EDR AI analyzer"   -                /usr/bin/nologin
# Members of this group see Synapse's desktop notifications (synapse-notify reads /run/synapse-notify).
g synapse-notify -
# the engine writes into the analyzer's folder through this group (SupplementaryGroups= in synapse-engined.service)
m synapse synapse-ai
