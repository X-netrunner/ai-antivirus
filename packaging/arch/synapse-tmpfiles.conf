# Install as /usr/lib/tmpfiles.d/synapse.conf
# Config is not secret but must not be world-writable (synapsectl enforces this).
d /etc/synapse     0755 root    root    -
d /var/lib/synapse 0750 synapse synapse -
# Rules are root-owned: the engine (user synapse) reads them and cannot change them. Shipped rules go in
# behavior/00-shipped.toml and yara/; your own in behavior/local/ (LOCAL- ids).
d /var/lib/synapse/rules          0755 root root -
d /var/lib/synapse/rules/behavior 0755 root root -
d /var/lib/synapse/rules/yara     0755 root root -
# The sensor (root) writes the event log. The setgid bit makes new log files
# belong to group synapse, so the engine and members of that group can read
# them (files are created mode 0640).
d /var/log/synapse 2750 root    synapse -
d /run/synapse     0750 synapse synapse -
