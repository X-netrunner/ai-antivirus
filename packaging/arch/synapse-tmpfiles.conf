# Install as /usr/lib/tmpfiles.d/synapse.conf
# Config is not secret but must not be world-writable (synapsectl enforces this).
d /etc/synapse     0755 root    root    -
d /var/lib/synapse 0750 synapse synapse -
# Rules are root-owned: the engine (user synapse) reads them and cannot change them. Shipped rules go in
# behavior/00-shipped.toml and yara/; your own in behavior/local/ (LOCAL- ids).
d /var/lib/synapse/rules          0755 root root -
d /var/lib/synapse/rules/behavior 0755 root root -
d /var/lib/synapse/rules/yara     0755 root root -
# The sensor (root) writes the event log. The setgid bit makes new log files
# belong to group synapse, so the engine and members of that group can read
# them (files are created mode 0640).
d /var/log/synapse 2750 root    synapse -
d /run/synapse     0750 synapse synapse -
# M4. Quarantined files: root only, never cleaned automatically.
d /var/lib/synapse/quarantine 0700 root root -
# Notification spool written by the responder (root); setgid so the files belong to group synapse-notify.
d /run/synapse-notify 2750 root synapse-notify -

# The analyzer's folder (M5). The engine (user synapse) writes bundles to spool/ and reads and removes answers in out/;
# synapse-ai (group synapse-ai) reads spool/ and writes out/. Neither can reach the other's state.
d /var/lib/synapse-ai       0750 synapse    synapse-ai -
d /var/lib/synapse-ai/spool 2750 synapse    synapse-ai -
d /var/lib/synapse-ai/out   2770 synapse-ai synapse-ai -
d /var/lib/synapse/corpus   0755 root       root       -

# Evidence copies of files replaced by a restore (root only, mode 000 files; never deleted automatically).
d /var/lib/synapse/restore-evidence 0700 root root -
