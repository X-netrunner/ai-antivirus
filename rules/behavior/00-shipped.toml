# AI Antivirus shipped behavior rules (spec 7, layer L3). Format: see README "Behavior rules".
# `action` is what ai-antivirus-responderd does with an alert, as far as general.mode allows. The default mode, alert-only,
# records the action as a dry run and notifies; levels above response.auto_levels_max (and 4+ always) wait for
# `ai-antivirus approve`.
# Not here yet, because the sensor does not report what they need: AV-B-0007 (file reads), AV-B-0009 (module loads),
# AV-B-0011 (ptrace). See README "M3: not done".

[[rule]]
id = 'AV-B-0001'
title = 'Shell with a socket as stdin (reverse shell)'
severity = 'high'
confidence = 0.9
# pacman runs its hooks and install scriptlets with stdin on a socket. Network sockets only: editors' terminals and coding
# agents give shells a Unix-domain socket as stdin, a reverse shell has a TCP or UDP one (and keeps it open).
exclude_ancestor_exe = ['/usr/bin/pacman']
match = { event = 'exec', exe_in = ['/usr/bin/bash', '/usr/bin/sh', '/usr/bin/dash', '/usr/bin/zsh', '/usr/bin/fish', '/usr/bin/ksh', '/usr/bin/mksh', '/usr/bin/busybox'], stdin_socket_network = true }
action = 'freeze'

[[rule]]
id = 'AV-B-0002'
title = 'Download piped into a shell or interpreter (curl | sh)'
severity = 'high'
confidence = 0.7
match = { event = 'exec', exe_in = ['/usr/bin/bash', '/usr/bin/sh', '/usr/bin/dash', '/usr/bin/zsh', '/usr/bin/fish', '/usr/bin/python3', '/usr/bin/perl', '/usr/bin/ruby', '/usr/bin/node'], stdin_from_exe_in = ['/usr/bin/curl', '/usr/bin/wget', '/usr/bin/wget2', '/usr/bin/aria2c'] }
action = 'freeze'

[[rule]]
id = 'AV-B-0003'
title = 'Program executed from memory (memfd)'
severity = 'high'
confidence = 0.8
# Known benign: runc / Docker re-executes itself from a memfd ("/memfd:runc_cloned..."). Add a LOCAL- override rule if you use it.
match = { event = 'exec', exe_prefix = ['/memfd:'] }
action = 'freeze'

[[rule]]
id = 'AV-B-0004'
title = 'Write to /etc/ld.so.preload'
severity = 'critical'
confidence = 0.9
exclude_exe = ['/usr/bin/pacman']
match = { event = 'file_write', path_in = ['/etc/ld.so.preload'] }
action = 'freeze'

[[rule]]
id = 'AV-B-0005'
title = 'Service, timer or autostart entry written by a non-package process'
severity = 'medium'
confidence = 0.6
exclude_exe = ['/usr/bin/pacman', '/usr/bin/systemctl', '/usr/lib/systemd/systemd']
match = { event = 'file_write', path_prefix = ['/etc/systemd/system/', '/etc/systemd/user/', '/usr/lib/systemd/system/', '/usr/lib/systemd/user/', '~/.config/systemd/user/', '~/.config/autostart/', '/etc/xdg/autostart/', '/etc/cron.d/', '/etc/cron.daily/', '/etc/cron.hourly/', '/var/spool/cron/'], outside_pacman = true }
action = 'notify'

[[rule]]
id = 'AV-B-0006'
title = 'SSH authorized_keys changed by a program other than an editor'
severity = 'high'
confidence = 0.7
exclude_exe = ['/usr/bin/vim', '/usr/bin/nvim', '/usr/bin/vi', '/usr/bin/nano', '/usr/bin/emacs', '/usr/bin/micro', '/usr/bin/helix', '/usr/bin/hx', '/usr/bin/kate', '/usr/bin/gedit', '/usr/bin/gnome-text-editor', '/usr/bin/mousepad', '/usr/bin/code', '/usr/bin/codium', '/usr/bin/zed']
match = { event = 'file_write', path_in = ['~/.ssh/authorized_keys', '~/.ssh/authorized_keys2', '/etc/ssh/authorized_keys'] }
action = 'notify'

[[rule]]
id = 'AV-B-0008'
title = 'New setuid-root file outside a pacman transaction'
severity = 'high'
confidence = 0.8
exclude_exe = ['/usr/bin/pacman']
match = { event = 'file_write', setuid_file = true, outside_pacman = true }
action = 'quarantine'

[[rule]]
id = 'AV-B-0010'
title = 'Ransomware-like mass rewrite in a home directory'
severity = 'critical'
confidence = 0.8
scope = 'process_tree'
window_secs = 10
threshold = { distinct_files_written = 200, high_entropy_ratio = 0.7 }
# Archivers, compressors, copy and sync tools legitimately write many compressed files quickly (found by the VM soak: gzip over
# 320 files); so do Steam, Flatpak and caches. gpg and openssl are deliberately NOT here: encrypting many files is what ransomware does.
exclude_exe = ['/usr/bin/pacman', '/usr/bin/makepkg', '/usr/bin/rsync', '/usr/bin/cp', '/usr/bin/mv', '/usr/bin/tar', '/usr/bin/bsdtar', '/usr/bin/unzip', '/usr/bin/7z', '/usr/bin/7za', '/usr/bin/unrar', '/usr/bin/borg', '/usr/bin/restic', '/usr/bin/rclone', '/usr/bin/git', '/usr/bin/flatpak', '/usr/bin/gzip', '/usr/bin/pigz', '/usr/bin/bzip2', '/usr/bin/xz', '/usr/bin/zstd', '/usr/bin/lz4', '/usr/bin/zip']
match = { event = 'file_write', path_prefix = ['~/'], path_not_prefix = ['~/.cache/', '~/.local/share/Steam/', '~/.steam/', '~/.var/app/', '~/.local/share/flatpak/', '~/.cargo/', '~/.rustup/', '~/.npm/', '~/.local/share/Trash/'] }
action = 'freeze'

[[rule]]
id = 'AV-B-0012'
title = 'Connection to a common mining-pool port'
severity = 'medium'
confidence = 0.5
# Port only: without the sustained-CPU half of the spec rule this is a weak signal, hence notify.
match = { event = 'connect', port_in = [3333, 3334, 4444, 5555, 7777, 9999, 14433, 14444, 45560, 45700] }
action = 'notify'

[[rule]]
id = 'AV-B-0015'
title = 'Mining-pool connection from a process that keeps the CPU busy'
severity = 'high'
confidence = 0.8
# The full spec rule: the AV-B-0012 port signal plus sustained CPU. The engine samples /proc/<pid>/stat at the connect
# and again after cpu_window_secs, only for processes that matched the port half.
match = { event = 'connect', port_in = [3333, 3334, 4444, 5555, 7777, 9999, 14433, 14444, 45560, 45700], min_cpu_percent = 60, cpu_window_secs = 60 }
action = 'notify'

[[rule]]
id = 'AV-B-0013'
title = 'Program executed from a world-writable temporary folder'
severity = 'medium'
confidence = 0.5
# Some installers and AppImages run from /tmp; this is why it only notifies.
match = { event = 'exec', exe_prefix = ['/tmp/', '/dev/shm/', '/var/tmp/'] }
action = 'notify'

[[rule]]
id = 'AV-B-0014'
title = 'Program executed from a deleted file'
severity = 'high'
confidence = 0.7
match = { event = 'exec', exe_suffix = [' (deleted)'] }
action = 'freeze'

[[rule]]
id = 'AV-B-0020'
title = "AI Antivirus's own files written outside a pacman transaction"
severity = 'critical'
confidence = 0.8
# AI Antivirus's programs, its configuration and rules (/etc/ai-antivirus), its units. Its own daemons write their state under
# /var/lib/ai-antivirus (not covered here); the CLI writes rules when you approve one.
exclude_exe = ['/usr/bin/pacman', '/usr/bin/ai-antivirus', '/usr/bin/systemctl', '/usr/lib/systemd/systemd']
match = { event = 'file_write', path_prefix = ['/usr/lib/ai-antivirus/', '/etc/ai-antivirus/', '/usr/bin/ai-antivirus', '/usr/lib/systemd/system/ai-antivirus-', '/etc/systemd/system/ai-antivirus-'], outside_pacman = true }
action = 'notify'
