# Synapse example configuration. Copy to /etc/synapse/synapse.toml.
# Every key is optional; the values below are the defaults. Unknown keys are
# rejected. Check a file with:  synapsectl --config FILE config-check
# A unit test keeps this file identical to the built-in defaults.

[general]
# alert-only (log + notify) | contain (adds freeze/kill) | enforce (adds quarantine/block/restore)
mode = 'alert-only'
retention_days = 14            # 1..=365

[sensors]
fanotify_marks = ['/', '/home', '/tmp', '/var', '/dev/shm']
exec_scan_timeout_ms = 200     # 10..=1000; on timeout the scan fails open
use_ebpf = true                # process exec/exit/fork and connect via eBPF; falls back to /proc polling if it cannot load
ebpf_object = '/usr/lib/synapse/synapse-ebpf.o'  # built by `cargo xtask build-ebpf`; must be root-owned, not group/world-writable
use_fanotify = true            # needs CAP_SYS_ADMIN; without it Synapse runs with /proc polling only
# fanotify marks the whole filesystem containing each path (not just the mount).
fanotify_exclude = ['/var/log/journal', '/run/log/journal']
poll_interval_ms = 250         # 50..=10000; processes shorter-lived than this can be missed until M2 (eBPF)
event_log_max_mb = 64          # 1..=4096; rotate events.jsonl at this size
event_log_keep = 5             # 1..=100; rotated files events.jsonl.1 .. .N

[engine]
# Never acted on by the engine or the responder.
allow_exe = ['/usr/bin/pacman', '/usr/bin/makepkg', '/usr/lib/systemd/systemd']
max_actions_per_minute = 3     # 1..=60; exceeding it trips the circuit breaker
rules_dir = '/etc/synapse/rules'  # behavior/**/*.toml (behavior rules) and yara/*.yar
scan_max_mb = 32               # 1..=4096; larger files are scanned only by `synapsectl scan`
yara_timeout_ms = 2000         # 50..=60000; per scan
scan_on_write = true           # scan written files that are executable or in /tmp, /dev/shm, /var/tmp, ~/Downloads
max_scans_per_sec = 50         # 1..=10000; automatic scans beyond this are skipped and counted
require_signed_rules = false   # true: refuse rules that are not covered by a valid bundle.sig (synapsectl keygen, rules-sign)
rules_pubkey = '/etc/synapse/rules.pub'
# Synapse's own files, checked against pacman's records every 5 minutes (only those a package owns).
self_check_files = ['/usr/bin/synapse-sensord', '/usr/bin/synapse-engined', '/usr/bin/synapse-responderd', '/usr/bin/synapse-ai', '/usr/bin/synapse-notify', '/usr/bin/synapsectl', '/usr/lib/synapse/synapse-ebpf.o']

[ai]
enabled = false
# Loopback IP literal only (127.0.0.1 or [::1]); host names are rejected.
endpoint = 'http://127.0.0.1:11434'
model = 'set-your-local-model' # must be changed before enabling
timeout_secs = 30              # 1..=300
max_per_hour = 60              # 1..=3600; alerts sent to the model per hour
min_severity = 'medium'        # low | medium | high | critical: alerts at or above this are analyzed
corpus = '/etc/synapse/corpus/benign.jsonl'  # recording of ordinary activity; a proposed rule that fires on it is rejected

[response]
auto_levels_max = 3            # 0..=6, further capped by the mode; higher levels wait for `synapsectl approve`
nft_block_ttl_secs = 3600      # 1..=604800; network blocks expire on their own after this
dry_run = false                # true: record what would be done in every mode, do nothing
cgroup_root = '/sys/fs/cgroup' # cgroup v2 mount; suspects are frozen under synapse.slice/
notify_dir = '/run/synapse-notify'  # spool read by synapse-notify in your desktop session

[storage]
max_db_mb = 512                # 16..=65536; oldest events are pruned beyond this

[logging]
level = 'info'                 # error | warn | info | debug | trace (RUST_LOG overrides)
format = 'text'                # text | json

[paths]
state_dir = '/var/lib/synapse'
log_dir = '/var/log/synapse'
run_dir = '/run/synapse'
ai_dir = '/var/lib/synapse-ai'   # the analyzer's spool/ and out/, apart from state_dir
private_dir = '/var/lib/synapse-private'  # root only: quarantine/ and restore-evidence/ (never inside state_dir, which the engine owns)
